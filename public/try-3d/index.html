<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flora — настоящее 3D (three.js, стекло + свет)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{ margin:0; background:#06060a; color:#EDE7DF; font-family:"Manrope",system-ui,sans-serif; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  /* poster shown until the 3D is ready (instant first paint, no blank canvas) */
  #poster{ position:fixed; inset:0; z-index:2; transition:opacity .8s ease; background:
     radial-gradient(50% 45% at 50% 44%, rgba(255,180,90,.20), transparent 70%),
     radial-gradient(40% 40% at 62% 60%, rgba(236,30,147,.14), transparent 70%), #06060a; }
  #poster.hide{ opacity:0; pointer-events:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }
  .cap{ position:fixed; left:0; right:0; top:max(20px,env(safe-area-inset-top)); text-align:center; z-index:3; pointer-events:none; padding:0 20px; }
  .cap .w{ font-family:"Playfair Display",Georgia,serif; font-weight:600; font-size:clamp(26px,7vw,54px); margin:0; text-shadow:0 3px 40px rgba(0,0,0,.6); }
  .cap .s{ margin:.5em 0 0; font-size:clamp(11px,3vw,13px); letter-spacing:.18em; text-transform:uppercase; color:#948d84; }
  .hint{ position:fixed; left:0; right:0; bottom:max(20px,env(safe-area-inset-bottom)); text-align:center; z-index:3; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#7c766e; }
  .fail{ position:fixed; inset:0; z-index:4; display:none; align-items:center; justify-content:center; text-align:center; padding:40px; color:#cfc8bf; font-size:14px; }
</style>
</head>
<body>
<div id="poster"></div>
<canvas id="c"></canvas>
<div class="cap"><p class="w">Flora</p><p class="s">настоящее 3D · стекло + свет</p></div>
<div class="hint">двигай пальцем / мышью — объект живой</div>
<div class="fail" id="fail">Не удалось запустить 3D в этом браузере. Попробуй Chrome или Safari.</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

try {
  const canvas = document.getElementById('c');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 6.2);

  // studio reflections without any downloaded file
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  // colored studio glints (brand gold + fuchsia) — reflect as soft bars in the glass
  RectAreaLightUniformsLib.init();
  const l1 = new THREE.RectAreaLight(0xFFD65A, 6.0, 6, 6); l1.position.set(-4, 3, 3); l1.lookAt(0,0,0); scene.add(l1);
  const l2 = new THREE.RectAreaLight(0xEC1E93, 4.0, 6, 6); l2.position.set(4, -3, 2); l2.lookAt(0,0,0); scene.add(l2);
  const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(3, 4, 5); scene.add(key);
  scene.add(new THREE.AmbientLight(0xffffff, 0.15));

  // hero: high-poly glass torus-knot with a glowing gold core inside
  const group = new THREE.Group(); scene.add(group);
  const glass = new THREE.MeshPhysicalMaterial({
    transmission: 1.0, thickness: 1.6, roughness: 0.06, metalness: 0.0, ior: 1.5,
    clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 1.4,
    iridescence: 0.35, iridescenceIOR: 1.3, attenuationColor: new THREE.Color(0xffd9a0), attenuationDistance: 3.2,
    color: 0xffffff, transparent: true
  });
  const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(1.25, 0.40, 260, 40), glass);
  group.add(knot);
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 2),
    new THREE.MeshStandardMaterial({ color:0xFFB24B, emissive:0xFB8C3C, emissiveIntensity:2.4, roughness:0.4 }));
  group.add(core);

  // postprocessing: bloom + ACES output
  let composer, bloom;
  function buildComposer(w,h){
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    bloom = new UnrealBloomPass(new THREE.Vector2(w,h), 0.75, 0.5, 0.82);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());
  }

  function resize(){
    const w = canvas.clientWidth, h = canvas.clientHeight, dpr = Math.min(window.devicePixelRatio||1, 2);
    renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
    if(!composer) buildComposer(w*dpr, h*dpr); else composer.setSize(w*dpr, h*dpr);
  }
  window.addEventListener('resize', resize); resize();

  // pointer parallax (subtle, does not run away)
  let tx=0, ty=0, cx=0, cy=0;
  function ptr(x,y){ tx = (x/window.innerWidth*2-1); ty = (y/window.innerHeight*2-1); }
  window.addEventListener('pointermove', e=>ptr(e.clientX,e.clientY));
  window.addEventListener('touchmove', e=>{ if(e.touches[0]) ptr(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});

  // reveal (hide poster) once first frame is drawn
  const poster = document.getElementById('poster');
  let revealed=false;
  function reveal(){ if(revealed) return; revealed=true; setTimeout(()=>poster.classList.add('hide'), 60); }

  let running = true;
  document.addEventListener('visibilitychange', ()=>{ running=!document.hidden; if(running && !reduce) requestAnimationFrame(loop); });

  function render(t){
    cx += (tx-cx)*0.05; cy += (ty-cy)*0.05;
    group.rotation.y = (reduce?0.6:t*0.00016) + cx*0.6;
    group.rotation.x = -0.2 + cy*0.4 + (reduce?0:Math.sin(t*0.0003)*0.15);
    core.rotation.y = -t*0.0004; core.scale.setScalar(1 + (reduce?0:Math.sin(t*0.0011)*0.05));
    composer.render();
    reveal();
  }
  function loop(t){ if(!running) return; render(t||0); requestAnimationFrame(loop); }
  if(reduce){ render(0); } else { requestAnimationFrame(loop); }
} catch(err){
  console.error(err);
  document.getElementById('fail').style.display='flex';
  document.getElementById('poster').classList.add('hide');
}
</script>
</body>
</html>
