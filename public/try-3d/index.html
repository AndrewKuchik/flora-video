<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flora — настоящее 3D (лёгкая версия)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{ margin:0; background:#06060a; color:#EDE7DF; font-family:"Manrope",system-ui,sans-serif; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  #poster{ position:fixed; inset:0; z-index:2; transition:opacity .8s ease; background:
     radial-gradient(50% 45% at 50% 44%, rgba(255,180,90,.20), transparent 70%),
     radial-gradient(40% 40% at 62% 60%, rgba(236,30,147,.14), transparent 70%), #06060a; }
  #poster.hide{ opacity:0; pointer-events:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }
  .cap{ position:fixed; left:0; right:0; top:max(20px,env(safe-area-inset-top)); text-align:center; z-index:3; pointer-events:none; padding:0 20px; }
  .cap .w{ font-family:"Playfair Display",Georgia,serif; font-weight:600; font-size:clamp(26px,7vw,54px); margin:0; text-shadow:0 3px 40px rgba(0,0,0,.6); }
  .cap .s{ margin:.5em 0 0; font-size:clamp(11px,3vw,13px); letter-spacing:.18em; text-transform:uppercase; color:#948d84; }
  .hint{ position:fixed; left:0; right:0; bottom:max(20px,env(safe-area-inset-bottom)); text-align:center; z-index:3; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#7c766e; }
  .fail{ position:fixed; inset:0; z-index:4; display:none; align-items:center; justify-content:center; text-align:center; padding:40px; color:#cfc8bf; font-size:14px; }
</style>
</head>
<body>
<div id="poster"></div>
<canvas id="c"></canvas>
<div class="cap"><p class="w">Flora</p><p class="s">настоящее 3D · лёгкая версия</p></div>
<div class="hint">двигай пальцем / мышью — объект живой</div>
<div class="fail" id="fail">Не удалось запустить 3D в этом браузере. Попробуй Chrome или Safari.</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

try {
  const canvas = document.getElementById('c');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobile = window.matchMedia('(max-width: 820px)').matches || ('ontouchstart' in window);
  const DPR_CAP = mobile ? 1.25 : 1.75;
  const FPS = mobile ? 30 : 60;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, DPR_CAP));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.18;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 6.4);

  // reflections from a procedural studio env (one-time, cheap at runtime — no per-frame refraction pass)
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  RectAreaLightUniformsLib.init();
  const l1 = new THREE.RectAreaLight(0xFFD65A, 5.0, 6, 6); l1.position.set(-4, 3, 3); l1.lookAt(0,0,0); scene.add(l1);
  const l2 = new THREE.RectAreaLight(0xEC1E93, 3.6, 6, 6); l2.position.set(4, -3, 2); l2.lookAt(0,0,0); scene.add(l2);
  scene.add(new THREE.AmbientLight(0xffffff, 0.18));

  // hero: faceted reflective crystal (low-poly, NO transmission pass) + glowing core
  const group = new THREE.Group(); scene.add(group);
  const glass = new THREE.MeshPhysicalMaterial({
    metalness: 0.0, roughness: 0.04, clearcoat: 1.0, clearcoatRoughness: 0.06,
    envMapIntensity: 1.7, iridescence: 0.45, iridescenceIOR: 1.3,
    color: 0xdfe6ff, transparent: true, opacity: 0.86, flatShading: true
  });
  const crystal = new THREE.Mesh(new THREE.IcosahedronGeometry(1.7, 1), glass); // ~80 faces
  group.add(crystal);
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.72, 1),
    new THREE.MeshStandardMaterial({ color:0xFFB24B, emissive:0xFB8C3C, emissiveIntensity:2.6, roughness:0.5, flatShading:true }));
  group.add(core);

  let composer, bloom;
  function build(w,h){
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    bloom = new UnrealBloomPass(new THREE.Vector2(Math.max(2,w*0.5), Math.max(2,h*0.5)), 0.7, 0.5, 0.85); // half-res bloom
    composer.addPass(bloom);
    composer.addPass(new OutputPass());
  }
  function resize(){
    const w=canvas.clientWidth, h=canvas.clientHeight, dpr=Math.min(window.devicePixelRatio||1, DPR_CAP);
    renderer.setPixelRatio(dpr); renderer.setSize(w,h,false);
    camera.aspect=w/h; camera.updateProjectionMatrix();
    if(!composer) build(w*dpr,h*dpr); else composer.setSize(w*dpr,h*dpr);
  }
  window.addEventListener('resize', resize); resize();

  let tx=0,ty=0,cx=0,cy=0;
  function ptr(x,y){ tx=(x/window.innerWidth*2-1); ty=(y/window.innerHeight*2-1); }
  window.addEventListener('pointermove', e=>ptr(e.clientX,e.clientY));
  window.addEventListener('touchmove', e=>{ if(e.touches[0]) ptr(e.touches[0].clientX,e.touches[0].clientY); }, {passive:true});

  const poster=document.getElementById('poster'); let revealed=false;
  function reveal(){ if(revealed) return; revealed=true; setTimeout(()=>poster.classList.add('hide'),60); }

  let running=true;
  document.addEventListener('visibilitychange', ()=>{ running=!document.hidden; if(running && !reduce) requestAnimationFrame(loop); });

  const interval = 1000/FPS; let last=0;
  function render(t){
    cx+=(tx-cx)*0.05; cy+=(ty-cy)*0.05;
    group.rotation.y = (reduce?0.6:t*0.00015) + cx*0.6;
    group.rotation.x = -0.15 + cy*0.4 + (reduce?0:Math.sin(t*0.0003)*0.12);
    core.rotation.y = -t*0.0004; core.scale.setScalar(1+(reduce?0:Math.sin(t*0.0011)*0.05));
    composer.render(); reveal();
  }
  function loop(t){ if(!running) return; requestAnimationFrame(loop); if(t-last<interval) return; last=t; render(t||0); }
  if(reduce){ render(0); } else { requestAnimationFrame(loop); }
} catch(err){
  console.error(err);
  document.getElementById('fail').style.display='flex';
  document.getElementById('poster').classList.add('hide');
}
</script>
</body>
</html>
