<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flora — модели стеклянного цветка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#EDE7DF; --muted:#9a938a; --pill-bg:rgba(255,255,255,.06); --pill-br:rgba(255,255,255,.14); --pill-on:rgba(255,255,255,.16); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{ margin:0; background:#07070a; color:var(--ink); font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  #stage{position:fixed; inset:0}
  #gl{position:absolute; inset:0; width:100%; height:100%; display:block}

  /* corner logo lockup (2.5D mark + wordmark) */
  .brand{ position:absolute; left:max(16px,env(safe-area-inset-left)); top:max(14px,env(safe-area-inset-top)); z-index:3; display:flex; align-items:center; gap:10px; pointer-events:none; }
  .brand svg{ width:38px; height:38px; filter:drop-shadow(0 3px 8px rgba(0,0,0,.55)); }
  .brand .wm{ font-family:"Playfair Display",Georgia,serif; font-weight:600; font-size:24px; letter-spacing:.02em; line-height:1; }
  .brand .wm small{ display:block; font-family:"Manrope",sans-serif; font-weight:500; font-size:8.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin-top:3px; }

  /* language switcher mock */
  .lang{ position:absolute; right:max(14px,env(safe-area-inset-right)); top:max(14px,env(safe-area-inset-top)); z-index:3; display:flex; gap:2px; background:rgba(0,0,0,.28); padding:4px; border-radius:999px; border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(8px); }
  .lang b{ font-weight:600; font-size:12px; letter-spacing:.04em; padding:5px 10px; border-radius:999px; color:var(--muted); cursor:pointer; }
  .lang b.on{ color:var(--ink); background:var(--pill-on); }

  .controls{ position:absolute; left:0; right:0; bottom:max(16px,env(safe-area-inset-bottom)); z-index:3; display:flex; flex-direction:column; gap:8px; align-items:center; padding:0 12px; }
  .grp{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; background:rgba(0,0,0,.28); padding:6px; border-radius:16px; border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(8px); max-width:640px}
  .grp.pill{border-radius:999px}
  button.ctl{ font:inherit; font-size:12px; letter-spacing:.02em; color:var(--ink); background:var(--pill-bg); border:1px solid var(--pill-br); padding:9px 13px; border-radius:999px; cursor:pointer; transition:background .18s ease, transform .12s ease; white-space:nowrap; }
  button.ctl:hover{background:var(--pill-on)}
  button.ctl:active{transform:scale(.96)}
  button.ctl[aria-pressed="true"]{background:var(--pill-on); border-color:rgba(255,255,255,.42)}
  button.ctl:focus-visible{outline:2px solid #FFD65A; outline-offset:2px}
  .lbl{font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); align-self:center; margin-right:2px; opacity:.7}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>

  <div class="brand">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFD65A"/><stop offset=".5" stop-color="#FB8C3C"/><stop offset="1" stop-color="#EC1E93"/>
        </linearGradient>
      </defs>
      <g fill="url(#fg)">
        <g transform="rotate(0 24 24)"><path d="M24 6 C27 15 27 18 24 22 C21 18 21 15 24 6Z"/></g>
        <g transform="rotate(60 24 24)"><path d="M24 6 C27 15 27 18 24 22 C21 18 21 15 24 6Z"/></g>
        <g transform="rotate(120 24 24)"><path d="M24 6 C27 15 27 18 24 22 C21 18 21 15 24 6Z"/></g>
        <g transform="rotate(180 24 24)"><path d="M24 6 C27 15 27 18 24 22 C21 18 21 15 24 6Z"/></g>
        <g transform="rotate(240 24 24)"><path d="M24 6 C27 15 27 18 24 22 C21 18 21 15 24 6Z"/></g>
        <g transform="rotate(300 24 24)"><path d="M24 6 C27 15 27 18 24 22 C21 18 21 15 24 6Z"/></g>
      </g>
      <circle cx="24" cy="24" r="3.4" fill="#fff" opacity=".92"/>
      <circle cx="24" cy="24" r="20.5" fill="none" stroke="url(#fg)" stroke-width="1.6" opacity=".7"/>
    </svg>
    <span class="wm">Flora<small>Creative Studio · Rīga</small></span>
  </div>

  <div class="lang" role="group" aria-label="Язык">
    <b class="on">LV</b><b>RU</b><b>EN</b>
  </div>

  <div class="controls">
    <div class="grp" role="group" aria-label="Модель">
      <span class="lbl">модель</span>
      <button class="ctl" data-model="0" aria-pressed="true">Диафрагма</button>
      <button class="ctl" data-model="1" aria-pressed="false">Кристалл</button>
      <button class="ctl" data-model="2" aria-pressed="false">Лилия</button>
      <button class="ctl" data-model="3" aria-pressed="false">Роза</button>
      <button class="ctl" data-model="4" aria-pressed="false">Кольцо</button>
      <button class="ctl" data-model="5" aria-pressed="false">Бутон</button>
    </div>
    <div class="grp pill" role="group" aria-label="Цвет стекла">
      <button class="ctl" data-pal="0" aria-pressed="true">Золото → фуксия</button>
      <button class="ctl" data-pal="1" aria-pressed="false">Лёд</button>
      <button class="ctl" data-pal="2" aria-pressed="false">Янтарь</button>
    </div>
    <div class="grp pill" role="group" aria-label="Фон">
      <button class="ctl" data-bg="0" aria-pressed="true">Тёмный</button>
      <button class="ctl" data-bg="1" aria-pressed="false">Светлый</button>
    </div>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById('gl');
  var gl = canvas.getContext('webgl', {antialias:false, alpha:false, premultipliedAlpha:false});
  if(!gl){ document.body.innerHTML = '<p style="color:#eee;font-family:sans-serif;padding:40px;text-align:center">Твой браузер не поддерживает WebGL. Открой в Safari или Chrome.</p>'; return; }

  var VERT = 'attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }';

  var FRAG = [
  '#ifdef GL_FRAGMENT_PRECISION_HIGH',
  'precision highp float;',
  '#else',
  'precision mediump float;',
  '#endif',
  'uniform vec2 uRes; uniform float uTime; uniform float uScale; uniform float uTurn;',
  'uniform vec2 uMouse; uniform int uPal; uniform int uBg; uniform int uModel;',
  '#define TAU 6.28318530718',
  'mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }',
  'float smin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }',
  'float sdEllipsoid(vec3 p, vec3 r){ float k0=length(p/r); float k1=length(p/(r*r)); return k0*(k0-1.0)/k1; }',
  'float sdTorus(vec3 p, vec2 t){ vec2 q=vec2(length(p.xz)-t.x, p.y); return length(q)-t.y; }',
  'float sdBox(vec3 p, vec3 b){ vec3 d=abs(p)-b; return length(max(d,0.0))+min(max(d.x,max(d.y,d.z)),0.0); }',
  'float mIris(vec3 p){',
  '  float d = 1e9;',
  '  for(int i=0;i<6;i++){',
  '    float a = float(i)/6.0*TAU;',
  '    vec3 q=p; q.xz = rot(-a)*q.xz; q.x -= 0.55; q.xy = rot(0.22)*q.xy;',
  '    d = min(d, sdBox(q, vec3(0.42,0.045,0.17)) - 0.02);',
  '  }',
  '  return d;',
  '}',
  'float mCrystal(vec3 p){',
  '  float d = length(p) - 0.62;',
  '  for(int i=0;i<8;i++){',
  '    float a = float(i)/8.0*TAU;',
  '    d = max(d, dot(p, normalize(vec3(cos(a),0.34,sin(a))))-0.40);',
  '    d = max(d, dot(p, normalize(vec3(cos(a),-0.34,sin(a))))-0.40);',
  '  }',
  '  d = max(d, dot(p,vec3(0.0,1.0,0.0))-0.52);',
  '  d = max(d, dot(p,vec3(0.0,-1.0,0.0))-0.52);',
  '  return d;',
  '}',
  'float mLily(vec3 p){',
  '  float d = 1e9;',
  '  for(int i=0;i<5;i++){',
  '    float a = float(i)/5.0*TAU;',
  '    vec3 q=p; q.xz=rot(-a)*q.xz; q.x-=0.50; q.xy=rot(0.5)*q.xy;',
  '    d = smin(d, sdEllipsoid(q, vec3(0.55,0.055,0.22)), 0.05);',
  '  }',
  '  d = smin(d, length(p)-0.15, 0.06);',
  '  return d;',
  '}',
  'float mRose(vec3 p){',
  '  float d = length(p) - 0.13;',
  '  for(int i=0;i<4;i++){',
  '    float fi=float(i);',
  '    vec3 q=p; q.y -= fi*0.05; q.xz = rot(fi*0.42)*q.xz; q.yz = rot(0.14)*q.yz;',
  '    d = min(d, sdTorus(q, vec2(0.50 - fi*0.105, 0.052)));',
  '  }',
  '  return d;',
  '}',
  'float mRing(vec3 p){',
  '  vec3 q=p; q.yz = rot(0.5)*q.yz;',
  '  return sdTorus(q, vec2(0.50, 0.14));',
  '}',
  'float mBloom(vec3 p){',
  '  float d = 1e9;',
  '  for(int i=0;i<4;i++){',
  '    float a=float(i)/4.0*TAU;',
  '    vec3 q=p; q.xz=rot(-a)*q.xz; q.x-=0.34; q.y*=1.15;',
  '    d = smin(d, length(q)-0.30, 0.22);',
  '  }',
  '  d = smin(d, length(p*vec3(1.0,1.1,1.0))-0.27, 0.24);',
  '  return d;',
  '}',
  'float map(vec3 p){',
  // floating (zero-g) tumble: slow spin + gentle nod
  '  p.xz = rot(uTurn)*p.xz;',
  '  p.yz = rot(0.16*sin(uTime*0.5))*p.yz;',
  '  p /= uScale;',
  '  float d;',
  '  if(uModel==0) d=mIris(p);',
  '  else if(uModel==1) d=mCrystal(p);',
  '  else if(uModel==2) d=mLily(p);',
  '  else if(uModel==3) d=mRose(p);',
  '  else if(uModel==4) d=mRing(p);',
  '  else d=mBloom(p);',
  '  return d*uScale;',
  '}',
  'vec3 calcNormal(vec3 p){',
  '  vec2 e = vec2(0.0012,0.0);',
  '  return normalize(vec3(',
  '    map(p+e.xyy)-map(p-e.xyy),',
  '    map(p+e.yxy)-map(p-e.yxy),',
  '    map(p+e.yyx)-map(p-e.yyx)));',
  '}',
  'vec3 palette(float t){',
  '  if(uPal==1){ vec3 a=vec3(0.80,0.92,1.0); vec3 b=vec3(0.62,0.80,0.98); vec3 c=vec3(0.90,0.97,1.0); return t<0.5?mix(a,b,t*2.0):mix(b,c,(t-0.5)*2.0); }',
  '  if(uPal==2){ vec3 a=vec3(1.0,0.86,0.42); vec3 b=vec3(0.98,0.62,0.24); vec3 c=vec3(0.86,0.42,0.14); return t<0.5?mix(a,b,t*2.0):mix(b,c,(t-0.5)*2.0); }',
  '  vec3 gold=vec3(1.0,0.84,0.34); vec3 orange=vec3(0.98,0.53,0.22); vec3 fuchsia=vec3(0.93,0.11,0.57);',
  '  return t<0.5?mix(gold,orange,t*2.0):mix(orange,fuchsia,(t-0.5)*2.0);',
  '}',
  'vec3 env(vec3 d){',
  '  vec3 top, bot;',
  '  if(uBg==1){ top=vec3(0.92,0.90,0.88); bot=vec3(0.74,0.73,0.75); }',
  '  else { top=vec3(0.055,0.055,0.075); bot=vec3(0.01,0.01,0.02); }',
  '  vec3 c = mix(bot, top, clamp(d.y*0.5+0.5,0.0,1.0));',
  '  float key = pow(max(dot(d, normalize(vec3(0.55,0.7,0.45))),0.0), 40.0);',
  '  c += vec3(1.0,0.96,0.88)*key*1.4;',
  '  float rim = pow(max(dot(d, normalize(vec3(-0.6,-0.1,0.55))),0.0), 18.0);',
  '  c += vec3(0.95,0.25,0.62)*rim*0.5;',
  '  return c;',
  '}',
  'vec3 shade(vec3 p, vec3 n, vec3 rd){',
  '  float fres = pow(1.0 - max(dot(n,-rd),0.0), 4.0);',
  '  vec3 refl = env(reflect(rd,n));',
  '  float rr = env(refract(rd,n,0.90)).r;',
  '  float gg = env(refract(rd,n,0.925)).g;',
  '  float bb = env(refract(rd,n,0.95)).b;',
  '  vec3 refr = vec3(rr,gg,bb);',
  '  float t = clamp(p.y*0.55+0.5 + 0.12*sin(atan(p.z,p.x)*3.0),0.0,1.0);',
  '  vec3 tint = palette(t);',
  '  vec3 col = mix(refr*tint, refl, clamp(fres,0.0,1.0));',
  '  vec3 L1 = normalize(vec3(0.55,0.85,0.5));',
  '  vec3 h1 = normalize(L1 - rd);',
  '  col += vec3(1.0)*pow(max(dot(n,h1),0.0),140.0)*1.6;',
  '  vec3 L2 = normalize(vec3(-0.5,0.35,0.7));',
  '  vec3 h2 = normalize(L2 - rd);',
  '  col += vec3(1.0,0.6,0.85)*pow(max(dot(n,h2),0.0),90.0)*0.9;',
  '  col += tint*fres*0.6;',
  '  return col;',
  '}',
  'void main(){',
  '  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;',
  // three-quarter camera (~35 deg elevation) so we look INTO the bloom
  '  float el = clamp(0.62 - uMouse.y*0.30, 0.18, 1.25);',
  '  float az = uMouse.x*0.5;',
  '  float R = 3.5;',
  '  vec3 ro = vec3(R*cos(el)*sin(az), R*sin(el), R*cos(el)*cos(az));',
  '  vec3 ta = vec3(0.0,-0.02,0.0);',
  '  vec3 fwd = normalize(ta-ro);',
  '  vec3 rgt = normalize(cross(vec3(0.0,1.0,0.0),fwd));',
  '  vec3 upv = cross(fwd,rgt);',
  '  vec3 rd = normalize(uv.x*rgt + uv.y*upv + 1.75*fwd);',
  '  float t = 0.0; float glow = 0.0; bool hit=false; vec3 p;',
  '  for(int i=0;i<100;i++){',
  '    p = ro + rd*t;',
  '    float d = map(p);',
  '    glow += 0.08/(1.0 + d*d*45.0);',
  '    if(d < 0.0007){ hit=true; break; }',
  '    t += d*0.9;',
  '    if(t > 9.0) break;',
  '  }',
  '  vec3 col;',
  '  if(hit){ vec3 n = calcNormal(p); col = shade(p,n,rd); }',
  '  else { col = env(rd); }',
  '  vec3 bloomTint = palette(0.7);',
  '  col += bloomTint * glow * (uBg==1 ? 0.09 : 0.15);',
  '  float vig = 1.0 - 0.34*dot(uv,uv);',
  '  col *= clamp(vig,0.0,1.0);',
  '  col = col/(col+vec3(1.0));',
  '  col = pow(col, vec3(0.4545));',
  '  gl_FragColor = vec4(col,1.0);',
  '}'
  ].join('\n');

  function compile(type, src){
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); }
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var aloc = gl.getAttribLocation(prog,'a');
  gl.enableVertexAttribArray(aloc);
  gl.vertexAttribPointer(aloc,2,gl.FLOAT,false,0,0);

  var U = {
    res: gl.getUniformLocation(prog,'uRes'), time: gl.getUniformLocation(prog,'uTime'),
    scale: gl.getUniformLocation(prog,'uScale'), turn: gl.getUniformLocation(prog,'uTurn'),
    mouse: gl.getUniformLocation(prog,'uMouse'), pal: gl.getUniformLocation(prog,'uPal'),
    bg: gl.getUniformLocation(prog,'uBg'), model: gl.getUniformLocation(prog,'uModel')
  };

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pal = 0, bg = 0, model = 0, mx = 0, my = 0, tmx = 0, tmy = 0;

  function resize(){
    var dpr = Math.min(window.devicePixelRatio||1, 1.6);
    var w = Math.floor(canvas.clientWidth*dpr), h = Math.floor(canvas.clientHeight*dpr);
    if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); }
  }
  window.addEventListener('resize', resize);

  function setPointer(cx, cy){
    var r = canvas.getBoundingClientRect();
    tmx = ((cx - r.left)/r.width * 2 - 1);
    tmy = -((cy - r.top)/r.height * 2 - 1);
  }
  canvas.addEventListener('pointermove', function(e){ setPointer(e.clientX, e.clientY); });
  canvas.addEventListener('pointerleave', function(){ tmx=0; tmy=0; });
  canvas.addEventListener('touchmove', function(e){ if(e.touches[0]){ setPointer(e.touches[0].clientX, e.touches[0].clientY); } }, {passive:true});

  function wire(attr, setter){
    document.querySelectorAll('['+attr+']').forEach(function(b){
      b.addEventListener('click', function(){
        setter(parseInt(b.getAttribute(attr),10));
        document.querySelectorAll('['+attr+']').forEach(function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
        if(reduce) draw(lastT);
      });
    });
  }
  wire('data-model', function(v){ model=v; });
  wire('data-pal', function(v){ pal=v; });
  wire('data-bg', function(v){ bg=v; document.body.style.background = v===1 ? '#c9c7c9' : '#07070a'; });

  // language switcher mock
  document.querySelectorAll('.lang b').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.lang b').forEach(function(x){ x.classList.toggle('on', x===b); });
    });
  });

  var running = true;
  document.addEventListener('visibilitychange', function(){
    running = !document.hidden;
    if(running && !reduce) requestAnimationFrame(loop);
  });

  var lastT = 0;
  function draw(tSec){
    resize();
    mx += (tmx - mx)*0.08; my += (tmy - my)*0.08;
    var scale = reduce ? 1.0 : (1.0 + 0.012*Math.sin(tSec*0.8));
    var turn = reduce ? 0.7 : tSec*0.16;
    gl.uniform2f(U.res, canvas.width, canvas.height);
    gl.uniform1f(U.time, tSec);
    gl.uniform1f(U.scale, scale);
    gl.uniform1f(U.turn, turn);
    gl.uniform2f(U.mouse, mx, my);
    gl.uniform1i(U.pal, pal);
    gl.uniform1i(U.bg, bg);
    gl.uniform1i(U.model, model);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function loop(now){ if(!running) return; lastT = now*0.001; draw(lastT); requestAnimationFrame(loop); }

  resize();
  if(reduce){ draw(0.0); } else { requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
